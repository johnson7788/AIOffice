# Full stack: nginx (static SPA + API reverse-proxy) + FastAPI backend
# + Postgres (metadata) + MinIO (blob storage). `docker compose up --build`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aioffice
      POSTGRES_PASSWORD: aioffice
      POSTGRES_DB: aioffice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioffice"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aioffice
      MINIO_ROOT_PASSWORD: aioffice-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 aioffice aioffice-secret; do sleep 1; done;
      mc mb --ignore-existing local/aioffice;
      "

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aioffice:aioffice@postgres:5432/aioffice
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aioffice
      S3_ACCESS_KEY: aioffice
      S3_SECRET_KEY: aioffice-secret
      JWT_SECRET: change-me-in-prod-with-a-32b-secret
      XLSX_SIDECAR_BIN: /usr/local/bin/xlsx-sidecar  # binary baked into the image
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8585"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  miniodata:
