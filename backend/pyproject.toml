[project]
name = "aioffice-backend"
version = "0.1.0"
description = "AIOffice thin FastAPI backend (AI streaming proxy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.55",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
    "pydantic[email]>=2.9",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
