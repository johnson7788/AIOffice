server {
    listen 80;
    client_max_body_size 60m;  # blobs up to MAX_BLOB_MB (50) + overhead

    # backend API + SSE. Regex location wins over the static prefixes below.
    location ~ ^/(ai|auth|documents|projects|gallery|skills|files|share|healthz) {
        proxy_pass http://backend:8585;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;         # stream /ai/stream SSE frames immediately
        proxy_read_timeout 3600s;    # long AI turns
    }

    # sheets backend API — the SPA lives at /sheets/ (below) but the xlsx sidecar
    # API also hangs off /sheets/*, so match the fixed endpoint set here (regex
    # beats the /sheets/ prefix) and proxy it to the backend.
    # ponytail: keep this list in sync with backend/app/routers/sheets.py.
    location ~ ^/sheets/(open|read-range|read-formulas|read-media|recalc|manifest|read-entries|scan-entries|save|close)$ {
        proxy_pass http://backend:8585;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;    # large workbooks / recalc
    }

    # sheets SPA (built with base: /sheets/)
    location /sheets/ {
        alias /usr/share/nginx/html/sheets/;
        try_files $uri $uri/ /sheets/index.html;
    }

    # slides SPA (built with base: /slides/)
    location /slides/ {
        alias /usr/share/nginx/html/slides/;
        try_files $uri $uri/ /slides/index.html;
    }

    # pdf SPA (built with base: /pdf/)
    location /pdf/ {
        alias /usr/share/nginx/html/pdf/;
        try_files $uri $uri/ /pdf/index.html;
    }

    # markdown SPA (built with base: /markdown/)
    location /markdown/ {
        alias /usr/share/nginx/html/markdown/;
        try_files $uri $uri/ /markdown/index.html;
    }

    # docs SPA (default entry: login → home → editor)
    location / {
        root /usr/share/nginx/html/docs;
        try_files $uri $uri/ /index.html;
    }
}
